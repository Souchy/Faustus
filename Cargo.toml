[workspace]
members = ["crates/market-core", "crates/faust-fetch", "crates/ninja-fetch", "crates/market-store", "crates/market-service", "crates/market-ui/src-tauri", "crates/market-ui-deprecated"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.39", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "runtime-tokio-rustls", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
